name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: kommentarwache
          POSTGRES_PASSWORD: kommentarwache
          POSTGRES_DB: kommentarwache_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U kommentarwache"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://kommentarwache:kommentarwache@localhost:5432/kommentarwache_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm format:check
      - run: pnpm test
